services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trip_manager}
      POSTGRES_USER: ${POSTGRES_USER:-trip_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trip_manager}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-trip_manager} -d ${POSTGRES_DB:-trip_manager}']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: sh -c 'python manage.py migrate && exec python manage.py runserver 0.0.0.0:8004'
    volumes:
      - .:/app
    ports:
      - '8004:8004'
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.dev
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-trip_manager}
      POSTGRES_USER: ${POSTGRES_USER:-trip_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trip_manager}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
