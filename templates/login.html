{% extends 'base_auth.html' %}

{% block title %}Entrar — Gerenciador de Viagem{% endblock %}

{% block content %}
<div class="auth-minimal-wrapper">
    <div class="auth-minimal-inner">
        <div class="minimal-card-wrapper">
            <div class="text-end mb-3 dark-light-theme">
                <button type="button" class="nxl-head-link me-0 border-0 bg-transparent dark-button" data-theme-toggle aria-label="Ativar tema escuro" title="Ativar tema escuro">
                    <i class="feather-moon"></i>
                </button>
            </div>
            <div class="card mb-4">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <span class="logo logo-lg fs-4 fw-bold text-dark">Trip Manager</span>
                    </div>
                    <h5 class="fw-bold text-center mb-3">Entrar</h5>
                    {% if form.errors %}
                        <div class="alert alert-danger" role="alert">E-mail ou senha inválidos.</div>
                    {% endif %}
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="{{ form.username.id_for_label }}" class="form-label">{{ form.username.label }}</label>
                            <input type="email" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}" value="{{ form.username.value|default_if_none:'' }}" class="form-control" autocomplete="email" autofocus required>
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.password.id_for_label }}" class="form-label">{{ form.password.label }}</label>
                            <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}" class="form-control" autocomplete="current-password" required>
                        </div>
                        {% if next %}
                            <input type="hidden" name="next" value="{{ next }}">
                        {% endif %}
                        <button type="submit" class="btn btn-primary w-100">Acessar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
