[tool.poetry]
name = 'trip-manager'
version = '0.1.0'
description = 'Gerenciador de Viagem'
authors = ['Renan Clemonini <rclemon93@gmail.com>']
package-mode = false

[tool.poetry.dependencies]
python = '>=3.12,<3.13'
django = '~6.0'
psycopg = { extras = ['binary'], version = '^3.2' }
matplotlib = "^3.11.2"
requests = "^2.34.2"
gunicorn = "^26.2.0"
whitenoise = "^6.12.0"

[build-system]
requires = ['poetry-core']
build-backend = 'poetry.core.masonry.api'
